apply plugin: 'com.android.application'

// BLK-04: خصائص توقيع الإصدار (release signing). تُقرأ من ملف محلي غير متتبَّع
// (keystore/release-signing.local.properties، أنشأه أمر `keytool` — انظر
// android/RELEASE_SIGNING.md) إن وُجد على جهاز المطوّر، وإلا من متغيرات بيئة
// (RELEASE_STORE_FILE/RELEASE_STORE_PASSWORD/RELEASE_KEY_ALIAS/RELEASE_KEY_PASSWORD)
// التي يوفّرها CI عبر GitHub Secrets. لا سر واحد هنا مكتوب مباشرة في الكود.
def releaseSigningProps = new Properties()
def releaseSigningFile = rootProject.file('keystore/release-signing.local.properties')
def hasLocalSigningFile = releaseSigningFile.exists()
if (hasLocalSigningFile) {
    releaseSigningFile.withInputStream { releaseSigningProps.load(it) }
}
def hasEnvSigning = System.getenv('RELEASE_STORE_PASSWORD') != null
def hasReleaseSigning = hasLocalSigningFile || hasEnvSigning

android {
    namespace = "com.hudhudnest.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hudhudnest.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // BLK-04: أول ترقية فعلية منذ إنشاء المشروع (كانت 1 / "1.0" دائمًا).
        versionCode 5
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile hasLocalSigningFile ? rootProject.file(releaseSigningProps['storeFile']) : rootProject.file(System.getenv('RELEASE_STORE_FILE'))
                storePassword hasLocalSigningFile ? releaseSigningProps['storePassword'] : System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias hasLocalSigningFile ? releaseSigningProps['keyAlias'] : System.getenv('RELEASE_KEY_ALIAS')
                keyPassword hasLocalSigningFile ? releaseSigningProps['keyPassword'] : System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // إن لم يوجد أي مصدر توقيع (لا ملف محلي ولا أسرار CI)، يبقى البناء
            // بلا توقيع كما كان سابقًا بدلًا من فشل البناء بغموض.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
