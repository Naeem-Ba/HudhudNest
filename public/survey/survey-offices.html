    }
    kids.push(shareBlock());
    kids.push(el("p", { className: "q-help", text: "يمكنكم إغلاق هذه الصفحة الآن." }));
    $screen.appendChild(el("div", { className: "center" }, kids));
    $actions.hidden = true; $progress.hidden = true; setError("");
    var h = $screen.querySelector("h1"); if (h) h.focus({ preventScroll: true });
  }
  function onSaved() {
    var withContact = !!(S.pending && S.pending.contact_consent);
    S.done = true; S.pending = null; sending = false;
    clearAllLocal();                       /* removes progress and the pending copy (incl. the number) */
    showThanks(withContact);
  }
  function send() {
    if (sending || !S.pending) return;
    if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY) { showRetry("config"); return; }
    sending = true;
    var btn = document.getElementById("retry"); if (btn) btn.disabled = true;
    showSending();
    var ctrl = typeof AbortController === "function" ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, REQUEST_TIMEOUT_MS);
    var url = CONFIG.SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/" + TABLE;
    fetch(url, {
      method: "POST",
      headers: { "apikey": CONFIG.SUPABASE_ANON_KEY, "Authorization": "Bearer " + CONFIG.SUPABASE_ANON_KEY,
                 "Content-Type": "application/json", "Prefer": "return=minimal", "Content-Profile": SCHEMA },
      body: JSON.stringify(S.pending), signal: ctrl ? ctrl.signal : undefined, credentials: "omit", cache: "no-store",
      referrerPolicy: "no-referrer"
    }).then(function (res) {
      clearTimeout(timer);
      if (res.ok) { onSaved(); return; }
      return res.text().then(function (txt) {
        var body = {}; try { body = JSON.parse(txt); } catch (e) { body = {}; }
        var detail = String(body.message || "") + " " + String(body.details || "");
        /* 409 + 23505 on submission_id = this exact submission is already stored (an earlier attempt reached the
           server but its answer was lost). Only this browser knows the random submission_id, so it is our row. */
        if (res.status === 409 && body.code === "23505" && /submission_id/.test(detail)) { onSaved(); return; }
        sending = false;
        showRetry(res.status >= 500 || res.status === 408 || res.status === 429 ? "network" : "config");
      });
    }).catch(function () {
      clearTimeout(timer);
      sending = false;
      showRetry("network");
    });
  }
  window.addEventListener("online", function () {
    if (CONFIG.AUTO_RETRY_ENABLED && S.pending && !sending && S.current === "retry") send();
  });

  /* ---------- Resume ---------- */
  function showResume(saved, pending) {
    S.current = "resume";
    $screen.textContent = "";
    $screen.appendChild(el("div", null, [
      el("h1", { tabindex: "-1", text: "متابعة الاستبيان" }),
      el("p", { className: "status", text: "يبدو أنكم بدأتم الاستبيان سابقاً ولم تكملوه. هل ترغبون في المتابعة من حيث توقفتم؟" }),
      el("div", { className: "stack" }, [
        el("button", { type: "button", className: "btn btn-primary", text: "متابعة", onclick: function () {
          if (saved) { S = saved; S.a.q14_consent = false; }
          if (pending) { S.pending = pending; S.sid = pending.submission_id; showRetry("network"); send(); return; }
          var cur = screenById(S.current) && applies(screenById(S.current)) ? S.current : "intro";
          show(cur);
        } }),
        el("button", { type: "button", className: "btn btn-secondary", text: "البدء من جديد", onclick: function () {
          clearAllLocal(); S = freshState(); show("intro");
        } })
      ])
    ]));
    $actions.hidden = true; $progress.hidden = true;
    var h = $screen.querySelector("h1"); if (h) h.focus({ preventScroll: true });
  }
  function validSaved(x) {
    return x && typeof x === "object" && x.v === CONFIG.SURVEY_VERSION && typeof x.sid === "string" && x.a && x.orders &&
      Array.isArray(x.history) && Array.isArray(x.a.q5) && Array.isArray(x.a.q8) && Array.isArray(x.a.q10);
  }

  /* ---------- Boot ---------- */
  (function boot() {
    var logo = document.getElementById("logo");
    logo.addEventListener("error", function () {
      var b = document.getElementById("brand"); b.textContent = ""; b.appendChild(el("span", { className: "brand-text", text: "HUDHUDNEST هدهد نيست" }));
    });
    if (CONFIG.LOGO_URL) logo.src = CONFIG.LOGO_URL; else logo.dispatchEvent(new Event("error"));
    if (CONFIG.SURVEY_URL) document.head.appendChild(el("link", { rel: "canonical", href: CONFIG.SURVEY_URL }));
    $next.addEventListener("click", goNext);
    $back.addEventListener("click", goBack);
    document.getElementById("form").addEventListener("submit", function (e) { e.preventDefault(); goNext(); });

    var saved = storage.get(STORE_KEY), pending = storage.get(PENDING_KEY);
    if (!validSaved(saved)) { saved = null; storage.del(STORE_KEY); }
    if (pending && (typeof pending !== "object" || typeof pending.submission_id !== "string")) { pending = null; storage.del(PENDING_KEY); }
    if (pending || (saved && saved.current !== "intro")) { showResume(saved, pending); return; }
    show("intro");
  })();
})();
</script>
</body>
</html>
