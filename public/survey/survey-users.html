*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--soft);color:var(--text);font-family:'IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif;font-size:17px;line-height:1.6;min-height:100vh;min-height:100dvh}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 16px}
.progress[hidden]{display:none}
.progress>span{display:block;height:100%;width:0;background:var(--gold);transition:width .25s ease}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:20px 16px;flex:1 0 auto;display:flex;flex-direction:column}
h1{font-size:1.5rem;line-height:1.4;color:var(--navy);margin:0 0 12px;font-weight:600}
h2,legend.q{font-size:1.25rem;line-height:1.45;color:var(--navy);margin:0 0 6px;font-weight:600;padding:0}
h1:focus,h2:focus,legend:focus{outline:none}
p{margin:0 0 12px}
.hint{color:var(--muted);font-size:.95rem;margin:0 0 14px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.opts{display:flex;flex-direction:column;gap:10px;margin:8px 0 4px}
.opt{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--white);cursor:pointer;font-size:1.0625rem;line-height:1.45}
.opt input{width:22px;height:22px;margin:0;flex:0 0 22px;accent-color:var(--navy)}
.opt:has(input:checked){border-color:var(--navy);background:#F2F5FA}
.opt.sel{border-color:var(--navy);background:#F2F5FA}
.opt:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0 6px}
.scale .opt{flex-direction:column;justify-content:center;gap:4px;padding:8px 2px;min-height:60px;font-size:1.25rem;font-weight:600;text-align:center}
.scale .opt input{position:absolute;opacity:0;width:1px;height:1px}
.scale-ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.95rem;gap:8px}
label.field{display:block;font-weight:600;margin:14px 0 6px;font-size:1rem}
input[type=text],input[type=tel],textarea,select{width:100%;font:inherit;font-size:1.0625rem;color:var(--text);background:var(--white);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;min-height:48px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:3px solid var(--focus);outline-offset:1px;border-color:var(--navy)}
input[type=tel]{direction:ltr;text-align:right}
.counter{color:var(--muted);font-size:.875rem;text-align:left;margin-top:4px}

.privacy li{margin:0 0 4px}
.privacy a,.foot a{color:var(--navy)}
.meta{display:flex;gap:16px;color:var(--muted);font-size:.95rem;margin:0 0 14px;flex-wrap:wrap}
.ref{direction:ltr;unicode-bidi:embed;font-family:ui-monospace,Consolas,monospace;font-size:.95rem}

/* Honeypot hidden by clipping only: an off-screen offset (left:-10000px) creates a 10,000px horizontal scroll in RTL pages. */
.hp{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);clip-path:inset(50%);white-space:nowrap;border:0}

@media (orientation:landscape) and (max-height:500px){.wrap{padding-top:8px}header{padding:2px 0 6px}header img{height:28px}.opt{min-height:46px;padding:8px 12px}.scale .opt{min-height:48px}}

  <div class="foot" id="foot"></div>
</div>

            : 'يمكنك اختيار 3 خيارات فقط. ألغِ أحدها إذا أردت اختيار خيار آخر.');
        } else { setErr(''); }
      });
    }
    if (id === 'q7') {
      var more7 = function () {
        var v = checkedValue('q7'), box = document.getElementById('q7more');
        if (v === 'yes_multiple' || v === 'yes_once') {
          if (!document.getElementById('q7_in')) {
            mount(box, h('p', { cls: 'hint', style: 'margin-top:14px' }, 'سؤال اختياري:'), textField('q7_in', 'ماذا حدث باختصار؟', max, true, a.q7_details));
            if (a.q7_details) document.getElementById('q7_in').value = a.q7_details;
            bindCounter('q7_in');

        } else {

    }
    if (id === 'q10') {
      onChange('q10', function () {
        setErr('');
        Array.prototype.forEach.call(formEl.querySelectorAll('.scale .opt'), function (l) {
          l.classList.toggle('sel', l.querySelector('input').checked);
        });
      });
    }
    if (id === 'q9b' && a.q9b_details) { document.getElementById('q9b_in').value = a.q9b_details; }
    if (id === 'q11' && a.q11_text) { document.getElementById('q11_in').value = a.q11_text; }
    if (id === 'q9b') bindCounter('q9b_in');
    if (id === 'q11') bindCounter('q11_in');
    if (id === 'q12') {
      var n = document.getElementById('c_name'), p = document.getElementById('c_phone'), c = document.getElementById('c_consent');
      var note = document.getElementById('c_note');
      n.value = mem.contact.name; p.value = mem.contact.phone; c.checked = mem.contact.consent;
      var sync = function () {
        mem.contact = { name: n.value, phone: p.value, consent: c.checked };
        note.hidden = c.checked || !(n.value.trim() || p.value.trim());
        setErr('');
      };
      n.addEventListener('input', sync); p.addEventListener('input', sync); c.addEventListener('change', sync);
      sync();
    }
    if (['q1', 'q5', 'q9a', 'q9c'].indexOf(id) !== -1) onChange(id, function () { setErr(''); });
  }

  /* validate + commit the current screen; returns an error message or '' */
  function commit(id) {
    var a = state.answers, max = textMax(), v, el;
    switch (id) {
      case 'q1':
        v = checkedValue('q1'); if (!v) return 'يرجى اختيار إجابة للمتابعة.';
        a.q1 = v; return '';
      case 'q2':
        v = checkedValue('q2'); if (!v) return 'يرجى اختيار مكان إقامتك للمتابعة.';
        var d = (document.getElementById('q2_detail') || {}).value || '';
        if (!d) return v === 'inside' ? 'يرجى اختيار المحافظة.' : 'يرجى اختيار الدولة.';
        a.q2 = v; a.q2_detail = d;
        el = document.getElementById('q2_other');
        var o = el ? cleanText(el.value, SHORT_TEXT) : '';
        if (d === 'other' && o) a.q2_other = o; else delete a.q2_other;
        return '';
      case 'q3':
        v = checkedValues('q3'); if (!v.length) return 'يرجى اختيار منطقة واحدة على الأقل.';
        a.q3 = v;
        el = document.getElementById('q3_other');
        var t3 = el ? cleanText(el.value, SHORT_TEXT) : '';
        if (v.indexOf('other_gov') !== -1 && t3) a.q3_other = t3; else delete a.q3_other;
        return '';
      case 'q4':
        v = checkedValues('q4'); if (!v.length) return 'يرجى اختيار مصدر واحد على الأقل.';
        a.q4 = v;
        el = document.getElementById('q4_app');
        var t4 = el ? cleanText(el.value, SHORT_TEXT) : '';
        if (v.indexOf('app_site') !== -1 && t4) a.q4_app_name = t4; else delete a.q4_app_name;
        return '';
      case 'q5':
        v = checkedValue('q5'); if (!v) return 'يرجى اختيار إجابة للمتابعة.';
        a.q5 = v; return '';
      case 'q6':
        v = checkedValues('q6');
        if (!v.length) return 'يرجى اختيار مشكلة واحدة على الأقل (خياران كحد أقصى).';
        if (v.length > 2) return 'يمكنك اختيار خيارين فقط.';
        a.q6 = v; return '';
      case 'q7':
        v = checkedValue('q7'); if (!v) return 'يرجى اختيار إجابة للمتابعة.';
        a.q7 = v;
        el = document.getElementById('q7_in');
        var t7 = el ? cleanText(el.value, max) : '';
        if ((v === 'yes_multiple' || v === 'yes_once') && t7) a.q7_details = t7; else delete a.q7_details;
        return '';
      case 'q8':
        v = checkedValues('q8');
        if (v.length !== 3) return 'يرجى اختيار 3 خيارات بالضبط (اخترت ' + v.length + ').';
        a.q8 = v; return '';
      case 'q9a':
        v = checkedValue('q9a'); if (!v) return 'يرجى اختيار إجابة للمتابعة.';
        a.q9a = v; return '';
      case 'q9b':
        var t9 = cleanText(document.getElementById('q9b_in').value, max);
        if (t9) a.q9b_details = t9; else delete a.q9b_details;
        return '';
      case 'q9c':
        v = checkedValue('q9c'); if (!v) return 'يرجى اختيار إجابة للمتابعة.';
        a.q9c = v; return '';
      case 'q10':
        v = checkedValue('q10'); if (!v) return 'يرجى اختيار رقم من 1 إلى 5.';
        a.q10 = parseInt(v, 10); return '';
      case 'q11':
        var t11 = cleanText(document.getElementById('q11_in').value, max);
        if (t11) a.q11_text = t11; else delete a.q11_text;
        return '';
      case 'q12':
        var c = mem.contact, phone = normalizePhone(c.phone);
        if (c.consent) {
          if (!phone) return 'لإرسال الدعوة نحتاج رقم واتساب. أدخل الرقم أو أزل علامة الموافقة.';
          if (!phoneValid(phone)) return 'رقم واتساب غير صحيح. اكتبه بصيغة دولية تبدأ بـ + ثم 8 إلى 15 رقماً، مثل +963 9xx xxx xxx.';
          if (c.name.trim().length > 80) return 'الاسم طويل جداً.';
        }
        return '';
    }
    return '';
  }

  function goNext() {
    var id = state.current;
    var msg = commit(id);
    if (msg) { setErr(msg); var f = screenEl.querySelector('input,select,textarea'); if (f && id !== 'q12') { try { f.focus(); } catch (e) { /* ignore */ } } return; }
    if (id === 'q1' && REDIRECT_ROLES.indexOf(state.answers.q1) !== -1) { return renderRedirect(); }
    prune();
    var on = path(), idx = on.indexOf(id);
    if (idx === on.length - 1) { persist(); return finish(); }
    state.current = on[idx + 1];
    persist();
    render();
  }
  function goBack() {
    var on = path(), idx = on.indexOf(state.current);
    // keep what was typed on this screen without validating it
    softSave(state.current);
    if (idx <= 0) { state.phase = 'intro'; state.current = null; }
    else state.current = on[idx - 1];
    persist();
    render();
  }
  function softSave(id) {
    // Back must not lose typed text; choices are kept only once confirmed with "متابعة".
    var a = state.answers, max = textMax();
    if (id === 'q9b') { var t = cleanText(document.getElementById('q9b_in').value, max); if (t) a.q9b_details = t; else delete a.q9b_details; }
    if (id === 'q11') { var u = cleanText(document.getElementById('q11_in').value, max); if (u) a.q11_text = u; else delete a.q11_text; }
  }

  /* ---------------------------------------------- payload ---------------------------------------------- */
  function buildPayload() {
    prune();
    var a = state.answers, on = path(), screened = a.q1 === 'not_looking';
    var ans = { survey_version: CONFIG.SURVEY_VERSION, q1: a.q1, q2: a.q2, q2_detail: a.q2_detail };
    if (a.q2_detail === 'other' && a.q2_other) ans.q2_other = a.q2_other;
    var contact = { name: null, phone: null, consent: false };
    if (!screened) {
      ans.q3 = a.q3.slice(); if (a.q3_other) ans.q3_other = a.q3_other;
      ans.q4 = a.q4.slice(); if (a.q4_app_name) ans.q4_app_name = a.q4_app_name;
      ans.q5 = a.q5;
      ans.q6 = a.q6.slice(); ans.q6_order = state.q6Order.slice();
      ans.q7 = a.q7; if (a.q7_details && (a.q7 === 'yes_multiple' || a.q7 === 'yes_once')) ans.q7_details = a.q7_details;
      ans.q8 = a.q8.slice(); ans.q8_order = state.q8Order.slice();
      if (on.indexOf('q9a') !== -1) {
        ans.q9a = a.q9a;
        if (a.q9a === 'yes') { ans.q9b = a.q9b_details ? 'answered' : 'blank'; if (a.q9b_details) ans.q9b_details = a.q9b_details; }
        ans.q9c = a.q9c;
      }
      ans.q10 = a.q10;
      ans.q11 = a.q11_text ? 'answered' : 'blank'; if (a.q11_text) ans.q11_text = a.q11_text;
      var phone = normalizePhone(mem.contact.phone);
      if (mem.contact.consent && phoneValid(phone)) {
        contact = { name: cleanText(mem.contact.name, 80) || null, phone: phone, consent: true };
      }
      ans.q12 = contact.consent ? 'consented' : 'not_consented';
    }
    var now = Date.now(), started = state.startedAt || now;
    return {
      submission_id: uuid(),
      started_at: new Date(started).toISOString(),
      duration_sec: Math.max(0, Math.round((now - started) / 1000)),
      screened_out: screened,
      status: a.q1,
      residence: a.q2,
      residence_detail: a.q2_detail,
      top_problems: screened ? null : a.q6.slice(),
      fake_listing_experience: screened ? null : a.q7,
      try_likelihood: screened ? null : a.q10,
      answers: ans,
      contact_name: contact.name,
      contact_whatsapp: contact.phone,
      contact_consent: contact.consent,
      utm_source: state.meta.utm_source, utm_medium: state.meta.utm_medium,
      utm_campaign: state.meta.utm_campaign, utm_content: state.meta.utm_content,
      referrer: state.meta.referrer, device: state.meta.device,
      lang: (document.documentElement.lang || 'ar').slice(0, 2)
    };
  }
  function withoutContact(p) {
    var c = JSON.parse(JSON.stringify(p));
    c.contact_name = null; c.contact_whatsapp = null; c.contact_consent = false;
    if (c.answers && c.answers.q12) c.answers.q12 = 'not_consented';
    return c;
  }

  function finish() {
    // Honeypot: a filled "website" field means a bot. Show the normal thank-you screen and send nothing.
    if (document.getElementById('website').value) { wipe(); resetContact(); return renderThanks(false, null, false); }
    var payload = buildPayload(); // the submission_id is created exactly once, here
    state.pending = { submissionId: payload.submission_id, payload: payload, keepContact: false, contactWithheld: false };
    state.phase = 'pending';
    persist();
    renderPending();
    send();
  }

  /* ---------------------------------------------- sending ---------------------------------------------- */
  var lastError = null; // 'network' | 'server' | 'rejected' | 'config'

  function send() {
    if (sending || !state.pending) return;            // never more than one request at a time
    if (!isConfigured()) { lastError = 'config'; return renderPending(); }
    sending = true; lastError = null; clearTimeout(retryTimer);
    renderPending();
    var body = JSON.stringify(state.pending.payload);
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, REQUEST_TIMEOUT_MS);
    fetch(CONFIG.SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/survey_users_responses', {
      method: 'POST',
      headers: {
        'apikey': CONFIG.SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + CONFIG.SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        'Content-Profile': CONFIG.SUPABASE_SCHEMA || 'public',
        'Prefer': 'return=minimal'
      },
      body: body,
      cache: 'no-store',
      credentials: 'omit',
      referrerPolicy: 'no-referrer',
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (res) {
      clearTimeout(timer);
      if (res.ok) return onSaved();
      return res.text().then(function (txt) {
        var code = null;
        try { code = JSON.parse(txt).code; } catch (e) { code = null; }
        // 409 + 23505 = this submission_id is already stored (e.g. the first attempt succeeded but its
        // answer was lost on the way back). That is a success, and no duplicate row was created.
        if (res.status === 409 && code === '23505') return onSaved();
        if (res.status === 401 || res.status === 403 || res.status === 404) return onFailed('config', res.status);
        if (res.status === 400 || res.status === 409 || res.status === 413 || res.status === 422) return onFailed('rejected', res.status);
        return onFailed('server', res.status); // 408, 429, 5xx: temporary
      });
    }, function () {
      clearTimeout(timer);
      // Network failure or timeout. The row MAY have been stored; retrying with the same submission_id is safe.
      onFailed('network', 0);
    }).catch(function () { onFailed('network', 0); });
  }

  function onSaved() {
    sending = false;
    var withContact = !!(state.pending && state.pending.payload.contact_consent);
    var ref = state.pending ? state.pending.submissionId : null;
    wipe();                 // success: remove everything stored on this device
    resetContact();
    state.pending = null;
    firePixelLead();        // only after a confirmed save, and only with tracking consent
    renderThanks(state.answers.q1 === 'not_looking', ref, withContact);
  }

  function onFailed(kind, status) {
    sending = false;
    lastError = kind;
    if (window.console && console.warn) console.warn('survey submit failed:', kind, status || '');
    renderPending();
    if (CONFIG.AUTO_RETRY_ENABLED && (kind === 'network' || kind === 'server') && retryIndex < RETRY_DELAYS.length) {
      retryTimer = setTimeout(function () { if (navigator.onLine !== false) send(); }, RETRY_DELAYS[retryIndex++]);
    }
  }

  window.addEventListener('online', function () {
    if (CONFIG.AUTO_RETRY_ENABLED && state && state.phase === 'pending' && state.pending && !sending) { retryIndex = 0; send(); }
  });

  function renderPending() {
    setProgress(100);
    if (!state.pending) return;
    if (sending || lastError === null) {
      mount(screenEl, h('h2', { 'data-focus': true }, 'جارٍ إرسال إجاباتك…'),
        h('div', { cls: 'spinner', role: 'status', 'aria-label': 'جارٍ الإرسال' }),
        h('p', { cls: 'hint', style: 'text-align:center' }, 'لا تغلق الصفحة حتى تظهر رسالة الشكر.'));
      focusHeading();
      return;
    }
    var msgs = {
      network: 'تعذّر الاتصال بالإنترنت أو انقطع أثناء الإرسال. إجاباتك محفوظة على هذا الجهاز، ويمكنك إعادة المحاولة' +
        (CONFIG.AUTO_RETRY_ENABLED ? '، وسنحاول تلقائياً عند عودة الاتصال.' : '.'),
      server: 'الخادم لا يستجيب الآن. إجاباتك محفوظة على هذا الجهاز، أعد المحاولة بعد قليل.',
      rejected: 'لم نتمكن من حفظ الإجابات بسبب خطأ تقني من جهتنا. يمكنك إعادة المحاولة لاحقاً، ونعتذر عن الإزعاج.',
      config: 'الاستبيان غير متاح للإرسال حالياً بسبب خطأ في الإعداد من جهتنا. إجاباتك محفوظة على هذا الجهاز، يرجى المحاولة لاحقاً.'
    };
    var p = state.pending, hasContact = !!p.payload.contact_consent;
    mount(screenEl,
      h('h2', { 'data-focus': true }, 'لم تُرسل الإجابات بعد'),
      h('div', { cls: 'err', role: 'alert', 'aria-live': 'assertive' }, msgs[lastError] || msgs.network),
      (p.contactWithheld && !hasContact) ? h('p', { cls: 'note' }, 'لم نحفظ اسمك ورقمك على هذا الجهاز، لذلك سيُرسل ردّك دون بيانات تواصل.') : null,
      (hasContact && storageOk) ? h('label', { cls: 'check', 'for': 'keep' }, h('input', { type: 'checkbox', id: 'keep', checked: !!p.keepContact }),
        h('span', null, 'احتفظ باسمي ورقمي على هذا الجهاز مؤقتاً حتى يتم الإرسال. قد يراهما من يستخدم هذا المتصفح، ويُحذفان تلقائياً بعد الإرسال الناجح أو عند الضغط على «حذف إجاباتي من هذا الجهاز». بدون هذه العلامة لا نحفظهما إذا أغلقت الصفحة.')) : null,
      h('div', { cls: 'stack' },
        h('button', { type: 'button', cls: 'btn btn-primary', id: 'retry' }, 'إعادة المحاولة'),
        h('button', { type: 'button', cls: 'btn-link', id: 'discard' }, 'حذف إجاباتي من هذا الجهاز')));
    document.getElementById('retry').onclick = function () { retryIndex = 0; send(); };
    var keep = document.getElementById('keep');
    if (keep) keep.onchange = function () { p.keepContact = keep.checked; persist(); };
    var discard = document.getElementById('discard');
    discard.onclick = function () {
      if (discard.getAttribute('data-armed') !== '1') {
        discard.setAttribute('data-armed', '1');
        discard.textContent = 'اضغط مرة أخرى للتأكيد: ستُحذف إجاباتك ولن تُرسل';
        return;
      }
      clearTimeout(retryTimer); wipe(); resetContact(); state = freshState(); render();
    };
    focusHeading();
  }

  function renderRedirect() {
    // Owners and offices answer the offices survey; nothing is stored for them here.
    var role = state.answers.q1;
    setProgress(null);
    mount(screenEl,
      h('h1', { 'data-focus': true }, 'لديكم استبيان خاص'),
      h('p', null, role === 'office'
        ? 'هذا الاستبيان موجّه للباحثين عن عقار. للمكاتب والوسطاء استبيان خاص بأسئلة تناسب عملكم.'
        : 'هذا الاستبيان موجّه للباحثين عن عقار. للملاك استبيان خاص بأسئلة تناسب عرض العقارات.'),
      h('div', { cls: 'stack' },
        h('a', { cls: 'btn btn-primary', id: 'go_offices', href: CONFIG.OFFICES_URL || '/survey/offices' }, 'افتحوا استبيان المكاتب والملاك'),
        h('button', { type: 'button', cls: 'btn btn-secondary', id: 'redir_back' }, 'رجوع')));
    document.getElementById('redir_back').onclick = function () { delete state.answers.q1; state.phase = 'questions'; state.current = 'q1'; render(); };
    focusHeading();
  }

  function renderThanks(screened, ref, withContact) {
    state.phase = 'done';
    setProgress(100);
    var shareUrl = (CONFIG.SURVEY_URL || (location.origin + location.pathname)) + '?utm_source=share';
    var shareText = 'استبيان قصير (أقل من 3 دقائق) عن تجربة البحث عن عقار في دمشق وريفها: ' + shareUrl;
    mount(screenEl,
      h('h1', { 'data-focus': true }, 'شكراً لوقتك 🙏'),
      !screened ? h('p', null, 'إجاباتك ستساعدنا نبني شيئاً يحل مشكلة حقيقية.') : h('p', null, 'هذا الاستبيان مخصص لمن يبحث أو بحث عن عقار خلال آخر سنة. نقدّر وقتك.'),
      (!screened && withContact) ? h('p', null, 'سنتواصل معك عند فتح التجربة المبكرة.') : null,
      h('div', { cls: 'stack' }, h('a', { cls: 'btn btn-primary', id: 'share', target: '_blank', rel: 'noopener',
        href: 'https://wa.me/?text=' + encodeURIComponent(shareText) }, 'شارك الاستبيان')),
      ref ? h('p', { cls: 'hint', style: 'margin-top:16px' }, 'الرقم المرجعي لردّك (لطلب الحذف لاحقاً): ', h('span', { cls: 'ref' }, ref.slice(0, 8))) : null);
    focusHeading();
  }

  /* ---------------------------------------------- Meta Pixel (consent first) ---------------------------------------------- */
  var pixelLoaded = false;
  function loadPixel() {
    if (pixelLoaded || !pixelWanted() || getPref(PIXEL_KEY) !== 'granted') return;
    pixelLoaded = true;
    var n = window.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); };
    if (!window._fbq) window._fbq = n;
    n.push = n; n.loaded = true; n.version = '2.0'; n.queue = [];
    var s = document.createElement('script');
    s.async = true; s.src = 'https://connect.facebook.net/en_US/fbevents.js';
    document.head.appendChild(s);
    window.fbq('init', String(CONFIG.META_PIXEL_ID));
    window.fbq('track', 'PageView');
  }
  function firePixelLead() {
    if (pixelLoaded && typeof window.fbq === 'function' && getPref(PIXEL_KEY) === 'granted') window.fbq('track', 'Lead');
  }
  function initConsent() {
    var foot = document.getElementById('foot');
    if (!pixelWanted()) { foot.textContent = ''; return; } // no pixel configured: no banner, no tracking at all
    var banner = document.getElementById('consent');
    var choice = getPref(PIXEL_KEY);
    if (choice === 'granted') loadPixel();
    else if (choice !== 'denied') banner.hidden = false;
    document.getElementById('consent-yes').onclick = function () { setPref(PIXEL_KEY, 'granted'); banner.hidden = true; loadPixel(); };
    document.getElementById('consent-no').onclick = function () {
      setPref(PIXEL_KEY, 'denied'); banner.hidden = true;
      if (pixelLoaded && typeof window.fbq === 'function') window.fbq('consent', 'revoke');
    };
    mount(foot, h('button', { type: 'button', cls: 'btn-link', id: 'consent-open' }, 'إعدادات التتبع'));
    document.getElementById('consent-open').onclick = function () { banner.hidden = false; document.getElementById('consent-no').focus(); };
  }

  /* ---------------------------------------------- start ---------------------------------------------- */
  formEl.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (state.phase === 'intro') {
      state.phase = 'questions'; state.current = 'q1';
      if (!state.startedAt) state.startedAt = Date.now();
      persist(); render(); return;
    }
    if (state.phase === 'questions') goNext();
  });

  var logo = document.getElementById('logo');
  if (CONFIG.LOGO_URL) {
    logo.onload = function () { logo.hidden = false; };
    logo.onerror = function () { logo.hidden = true; };
    logo.src = CONFIG.LOGO_URL;
  }

  var saved = load();
  var valid = saved && saved.v === CONFIG.SURVEY_VERSION && saved.savedAt && (Date.now() - saved.savedAt) < MAX_AGE_MS &&
    saved.answers && Array.isArray(saved.q6Order) && Array.isArray(saved.q8Order) && saved.meta;
  if (valid && saved.phase === 'pending' && saved.pending && saved.pending.payload && saved.pending.submissionId) {
    state = saved; state.pending.keepContact = !!saved.pending.keepContact;
    lastError = 'network';
    renderPending();
    if (CONFIG.AUTO_RETRY_ENABLED && navigator.onLine !== false) send();
  } else if (valid && saved.phase === 'questions' && saved.current) {
    state = saved; state.pending = null;
    renderResumePrompt();
  } else {
    if (saved) wipe();
    state = freshState();
    render();
  }
  initConsent();
})();
</script>
</body>
</html>
