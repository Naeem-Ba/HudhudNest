## إعدادات بناء Netlify الخاصة بهذا المشروع.
#
# لماذا هذا الملف ضروري: قبل إضافته، كانت لوحة Netlify تُشغّل "npm run build"
# (إعداد production الافتراضي في angular.json) لكل الفروع بلا استثناء — بما فيها
# فرع staging نفسه. النتيجة: نشر staging كان في الواقع بناء production كاملاً
# (يقرأ environment.prod.ts) منشورًا فقط تحت نطاق Netlify الخاص بـ staging، وليس
# بناء staging حقيقيًا (الذي يقرأ environment.staging.ts). هذا الملف يعيد أمر
# البناء لفرع staging تحديدًا إلى "npm run build:staging" دون التأثير على أي فرع
# آخر — القسم العلوي [build] يبقى هو الافتراضي لكل سياق لم يُذكر صراحةً (بما فيها
# production)، ويطابق تمامًا القيم المضبوطة سلفًا في لوحة Netlify (Build & deploy).

[build]
  command = "npm run build"
  publish = "dist/Wohnungsmieten/browser"
  functions = "netlify/functions"

# اسم الفرع "staging" هنا يطابق حرفياً اسم الفرع في GitHub — Netlify يدعم
# [context.<اسم-فرع>] لتخصيص فرع بعينه، بالإضافة إلى السياقات المحجوزة
# (production / deploy-preview / branch-deploy).
[context.staging]
  command = "npm run build:staging"

## Production incident (2026-09-18) — the same-origin auth proxy (Safari third-party-cookie
## fix; see auth-api-base-url.ts) is NOT configured here. Two attempts were made and both
## failed live before the real cause was found:
##   1. `context = "production"` on a [[redirects]] rule — not valid Netlify syntax for a
##      per-rule field, so those rules were silently discarded entirely.
##   2. Plain unscoped [[redirects]] here (this file) — still didn't work, because Netlify
##      processes public/_redirects BEFORE netlify.toml, and that file's own catch-all
##      (`/* -> /index.html 200`) matched every /api/auth/* request first.
## Both failures manifested as POST /api/auth/login and /api/auth/refresh returning 404 on
## every browser — a total login outage, strictly worse than the Safari-only bug being fixed.
## The two proxy rules now live in public/_redirects instead, ordered ahead of its catch-all —
## see that file's own comment for the full story. Do not re-add them here without first
## removing/reordering public/_redirects, or history will repeat.
