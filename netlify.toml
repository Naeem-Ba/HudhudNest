## إعدادات بناء Netlify الخاصة بهذا المشروع.
#
# لماذا هذا الملف ضروري: قبل إضافته، كانت لوحة Netlify تُشغّل "npm run build"
# (إعداد production الافتراضي في angular.json) لكل الفروع بلا استثناء — بما فيها
# فرع staging نفسه. النتيجة: نشر staging كان في الواقع بناء production كاملاً
# (يقرأ environment.prod.ts) منشورًا فقط تحت نطاق Netlify الخاص بـ staging، وليس
# بناء staging حقيقيًا (الذي يقرأ environment.staging.ts). هذا الملف يعيد أمر
# البناء لفرع staging تحديدًا إلى "npm run build:staging" دون التأثير على أي فرع
# آخر — القسم العلوي [build] يبقى هو الافتراضي لكل سياق لم يُذكر صراحةً (بما فيها
# production)، ويطابق تمامًا القيم المضبوطة سلفًا في لوحة Netlify (Build & deploy).

[build]
  command = "npm run build"
  publish = "dist/Wohnungsmieten/browser"
  functions = "netlify/functions"

# اسم الفرع "staging" هنا يطابق حرفياً اسم الفرع في GitHub — Netlify يدعم
# [context.<اسم-فرع>] لتخصيص فرع بعينه، بالإضافة إلى السياقات المحجوزة
# (production / deploy-preview / branch-deploy).
[context.staging]
  command = "npm run build:staging"

## Production incident (2026-09-18), correction of a mistake in the previous version of this
## file: `context = "production"` on a [[redirects]] rule is NOT valid Netlify syntax for
## scoping an individual redirect (there is no such per-rule field). Netlify silently ignored
## all four rules that had it — proven live: a GET to a made-up path
## (/api/this-path-does-not-exist-at-all) returned 200 + this app's own index.html, which is
## Netlify's unrelated default SPA fallback, not any rule in this file. The practical effect
## was total login/refresh/CSRF outage on every browser (POST /api/auth/login and
## /api/auth/refresh both 404'd), which is strictly worse than the Safari-only bug these rules
## were meant to fix. Fixed by using plain, unscoped [[redirects]] below instead — Netlify's
## real, unambiguous syntax for "always apply this rule" — and, since that means this now
## necessarily also applies to the `staging` context (no verified working way to give staging
## rules a genuinely different target was available at the time of this fix), staging is
## deliberately excluded from src/app/core/auth/auth-api-base-url.ts's relative-path behavior
## for now, so it keeps calling its own backend directly exactly as before (unfixed for
## Safari there specifically, but not broken) instead of hitting these production-only rules.
[[redirects]]
  from = "/api/auth/*"
  to = "https://wohnungen-api.onrender.com/api/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/security/csrf-token"
  to = "https://wohnungen-api.onrender.com/api/security/csrf-token"
  status = 200
  force = true
