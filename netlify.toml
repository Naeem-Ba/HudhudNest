## إعدادات بناء Netlify الخاصة بهذا المشروع.
#
# لماذا هذا الملف ضروري: قبل إضافته، كانت لوحة Netlify تُشغّل "npm run build"
# (إعداد production الافتراضي في angular.json) لكل الفروع بلا استثناء — بما فيها
# فرع staging نفسه. النتيجة: نشر staging كان في الواقع بناء production كاملاً
# (يقرأ environment.prod.ts) منشورًا فقط تحت نطاق Netlify الخاص بـ staging، وليس
# بناء staging حقيقيًا (الذي يقرأ environment.staging.ts). هذا الملف يعيد أمر
# البناء لفرع staging تحديدًا إلى "npm run build:staging" دون التأثير على أي فرع
# آخر — القسم العلوي [build] يبقى هو الافتراضي لكل سياق لم يُذكر صراحةً (بما فيها
# production)، ويطابق تمامًا القيم المضبوطة سلفًا في لوحة Netlify (Build & deploy).

[build]
  command = "npm run build"
  publish = "dist/Wohnungsmieten/browser"
  functions = "netlify/functions"

# اسم الفرع "staging" هنا يطابق حرفياً اسم الفرع في GitHub — Netlify يدعم
# [context.<اسم-فرع>] لتخصيص فرع بعينه، بالإضافة إلى السياقات المحجوزة
# (production / deploy-preview / branch-deploy).
[context.staging]
  command = "npm run build:staging"

## Production incident (2026-09-18) — the same-origin auth proxy (Safari third-party-cookie
## fix; see src/app/core/auth/auth-api-base-url.ts) is NOT configured here, and was never
## configured in public/_redirects either, after three attempts:
##   1. `context = "production"` on a [[redirects]] rule here — not valid Netlify syntax for a
##      per-rule field, so those rules were silently discarded entirely.
##   2. Plain unscoped [[redirects]] here — still didn't work, because Netlify processes
##      public/_redirects BEFORE netlify.toml, and that file's own catch-all
##      (`/* -> /index.html 200`) matched every /api/auth/* request first.
##   3. The two rules moved into public/_redirects, ahead of its catch-all — fixed the routing,
##      but Netlify's declarative redirect/rewrite engine does not reliably relay Set-Cookie
##      headers back to the client, so the cookies this whole fix exists for still never
##      reached the browser.
## The actual, working fix is netlify/edge-functions/auth-proxy.mjs — full programmatic
## control over the Response, including correctly relaying every individual Set-Cookie header.
## It runs before both this file and public/_redirects are even considered. Do not add
## [[redirects]] or _redirects rules for /api/auth/*//api/security/csrf-token as an "easier"
## alternative — that is exactly how the first three attempts failed.
