name: Frontend CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Audit + Build Angular Production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Frontend audit guard
        run: npm run audit:frontend

      - name: Environment validation
        run: npm run check:env

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      - name: Build production
        run: npm run build:prod

  # BLK-04: يبني ويوقّع Android App Bundle باستخدام مفتاح الإنتاج الحقيقي
  # المخزَّن في GitHub Secrets (لا يُنشأ أو يُخزَّن هنا). يعمل فقط عند وجود
  # السر RELEASE_STORE_PASSWORD (منعًا لفشل الفروع/الشوك التي لا تملك الأسرار)،
  # ويقتصر على الدفعات إلى main تفاديًا لبناء/توقيع غير ضروري على كل PR.
  #
  # ⚠️ لم يُختبَر تشغيل هذه المهمة فعليًا بعد — حساب GitHub الحالي معطَّل بسبب
  # مشكلة فوترة (BUG-18) توقف كل CI. يجب التحقق منها بعد حل تلك المشكلة قبل
  # اعتبار BLK-04 "مغلقًا بالكامل" بدليل حي.
  android-release:
    name: Android — Build Signed Release AAB
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production web assets
        run: npm run build:prod

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        if: env.RELEASE_STORE_PASSWORD != ''
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}

      - name: Decode release keystore
        if: env.RELEASE_STORE_PASSWORD != ''
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_STORE_FILE_BASE64: ${{ secrets.RELEASE_STORE_FILE_BASE64 }}
        run: |
          mkdir -p android/keystore
          echo "$RELEASE_STORE_FILE_BASE64" | base64 -d > android/keystore/aqar-tech-release.keystore

      - name: Build signed release AAB
        if: env.RELEASE_STORE_PASSWORD != ''
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_FILE: keystore/aqar-tech-release.keystore
        working-directory: android
        run: ./gradlew bundleRelease --console=plain

      - name: Upload signed AAB
        if: env.RELEASE_STORE_PASSWORD != ''
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aqar-tech-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Skip (secrets not configured yet)
        if: env.RELEASE_STORE_PASSWORD == ''
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: echo "RELEASE_STORE_PASSWORD غير مضبوط في GitHub Secrets بعد — راجع android/RELEASE_SIGNING.md."

  ios-build:
    name: iOS Unsigned Simulator Build
    # macos-14 يدخل طور التقاعد في 2026-07-06 ويُسحَب نهائياً في 2026-11-02
    # (راجع: https://github.com/actions/runner-images/issues/13518) — macos-15 هو
    # أحدث صورة مستقرة غير مؤقَّتة اليوم؛ لا نستخدم macos-latest لأنه تحوّل مؤخراً
    # إلى macos-26 (Xcode 26 افتراضياً)، وهو أحدث من أن يُعتمَد بلا تحقّق صريح هنا.
    runs-on: macos-15
    timeout-minutes: 30
    # Validates that the Capacitor iOS project actually compiles (xcodebuild), catching
    # native-project breakage (e.g. a stale ios/ scaffold, a broken Package.swift) that
    # `npm run build:prod` alone cannot see. Deliberately unsigned/simulator-only: it needs
    # no Apple Developer Team ID or signing certificate, so it can run on every PR. It does
    # NOT archive, sign, or validate for App Store submission -- that remains a manual Xcode
    # step requiring a real Apple Developer account (see docs/IOS_RELEASE.md).
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # نثبّت نسخة Xcode صراحةً بدل الاعتماد على افتراضي الصورة (الذي يتغيّر بصمت مع
      # كل تحديث لـ macos-15). 16.4 هي نسخة Xcode 16 الافتراضية المؤكَّدة على هذه
      # الصورة حالياً وتفوق الحد الأدنى الذي يتطلّبه @capacitor/ios@8. حدِّثها هنا
      # عمداً (لا تتركها "latest") عند رفع iOS deployment target أو Capacitor مستقبلاً.
      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '16.4'

      - name: Log toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build production and sync iOS platform
        run: npm run ios:sync

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
