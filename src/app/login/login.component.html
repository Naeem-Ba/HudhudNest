<div class="auth-container">

  <h2 *ngIf="!showRegister">Login</h2>
  <h2 *ngIf="showRegister">Registrierung</h2>

  <!-- رسالة نجاح / خطأ -->
  <div *ngIf="message" class="alert" [ngClass]="{'success': success, 'error': !success}">
    {{ message }}
  </div>

  <!-- نموذج تسجيل الدخول -->
  <form *ngIf="!showRegister" (ngSubmit)="onLogin()" #loginForm="ngForm">

    <label>E-Mail:</label>
    <input type="email"
           name="email"
           [(ngModel)]="loginData.Email"
           required
           email
           #emailCtrl="ngModel">

    <div class="error" *ngIf="emailCtrl.invalid && emailCtrl.touched">
      Bitte geben Sie eine gültige E-Mail ein.
    </div>

    <label>Passwort:</label>
    <input type="password"
           name="password"
           [(ngModel)]="loginData.PasswordHash"
           required
           minlength="5"
           #passCtrl="ngModel">

    <div class="error" *ngIf="passCtrl.invalid && passCtrl.touched">
      Das Passwort muss mindestens 6 Zeichen enthalten.
    </div>

    <button type="submit" [disabled]="loginForm.invalid">Einloggen</button>

    <p class="switch">Noch kein Konto?
      <a (click)="toggleRegister()">Jetzt registrieren</a>
    </p>

  </form>


  <!-- نموذج التسجيل -->
  <form *ngIf="showRegister" (ngSubmit)="onRegister()" #regForm="ngForm">

    <label>Name:</label>
    <input type="text"
           name="name"
           [(ngModel)]="registerData.Name"
           required>

    <label>E-Mail:</label>
    <input type="email"
           name="emailReg"
           [(ngModel)]="registerData.Email"
           required
           email
           #emailRegCtrl="ngModel">

    <div class="error" *ngIf="emailRegCtrl.invalid && emailRegCtrl.touched">
      Ungültige E-Mail Adresse.
    </div>

    <label>Passwort:</label>
    <input type="password"
           name="passReg"
           [(ngModel)]="registerData.PasswordHash"
           required
           minlength="6">

    <button type="submit" [disabled]="regForm.invalid">Registrieren</button>

    <p class="switch">Bereits ein Konto?
      <a (click)="toggleRegister()">Zum Login</a>
    </p>

  </form>
</div>
