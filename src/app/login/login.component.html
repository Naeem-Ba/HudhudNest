<div class="auth-page">

  <!-- LEFT -->
  <div class="auth-left">
    
    <a routerLink="/Home" class="logo-container">
      <img src="images/horizontal-logo.png" alt="Logo" />
    </a>


    <h1>{{ showRegister ? 'Registrierung' : 'Erstelle deinen Account' }}</h1>

    <!-- Social Buttons -->
    <button class="social google">
      <span class="icon">G</span> Fortfahren mit Google
    </button>

    <button class="social apple">
      <span class="icon"></span> Fortfahren mit Apple
    </button>

    <div class="divider">oder</div>

    <!-- Alerts -->
    <div *ngIf="message" class="alert" [ngClass]="{success: success, error: !success}">
      {{ message }}
    </div>

    <!-- LOGIN FORM -->
    <form *ngIf="!showRegister" (ngSubmit)="onLogin()" #loginForm="ngForm">

      <label>E-Mail-Adresse *</label>
      <input type="email"
             [(ngModel)]="loginData.Email"
             name="email"
             required email>

      <label>Passwort *</label>

      <div class="password-wrapper">
        <input type="{{ showPass ? 'text' : 'password' }}"
               [(ngModel)]="loginData.PasswordHash"
               name="password"
               required minlength="5">
        <span class="toggle-pass" (click)="showPass = !showPass">
          {{ showPass ? '🙈' : '👁️' }}
        </span>
      </div>

      <button type="submit" class="submit" [disabled]="loginForm.invalid">
        Fortfahren
      </button>

      <p class="switch">
        Bereits registriert?
        <a (click)="toggleRegister()">Jetzt anmelden</a>
      </p>

    </form>

    <!-- REGISTER FORM -->
    <form *ngIf="showRegister" (ngSubmit)="onRegister()" #regForm="ngForm">

      <label>Name *</label>
      <input type="text" [(ngModel)]="registerData.Name" name="name" required>

      <label>E-Mail-Adresse *</label>
      <input type="email"
             [(ngModel)]="registerData.Email"
             name="emailReg"
             required email>

      <label>Passwort *</label>

      <div class="password-wrapper">
        <input type="{{ showPassReg ? 'text' : 'password' }}"
               [(ngModel)]="registerData.PasswordHash"
               name="passReg"
               required minlength="6">
        <span class="toggle-pass" (click)="showPassReg = !showPassReg">
          {{ showPassReg ? '🙈' : '👁️' }}
        </span>
      </div>

      <button type="submit" class="submit" [disabled]="regForm.invalid">
        Registrieren
      </button>

      <p class="switch">
        Bereits ein Konto?
        <a (click)="toggleRegister()">Zum Login</a>
      </p>

    </form>

  </div>

  <!-- RIGHT -->
  <div class="auth-right">
    <img src="images/login.jpg" class="side-image" />
  </div>

</div>
