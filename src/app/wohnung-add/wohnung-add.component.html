<div class="card">
  <h2>Wohnung hinzufügen</h2>

  <form (ngSubmit)="onSubmit()" #form="ngForm">

    
    <!-- Zum Mieten / Kaufen -->
    <div class="toggle-container">
        <button type="button"
            [class.active]="wohnung.ZumKaufen"
            (click)="setMode('kaufen')">
            Zum Kaufen
        </button>

       <button type="button"
            [class.active]="wohnung.ZumMieten"
            (click)="setMode('mieten')">
           Zum Mieten
       </button>
    </div>

    <!-- Titel -->
    <label>Titel:</label>
    <input type="text" name="Titel" [(ngModel)]="wohnung.Titel" required />

    <!-- Beschreibung -->
    <label>Beschreibung:</label>
    <textarea name="Beschreibung" [(ngModel)]="wohnung.Beschreibung"></textarea>

    <!-- Adresse -->
    <label>Adresse:</label>
    <input type="text" name="Adresse" [(ngModel)]="wohnung.Adresse" />

    <!-- ENUM: Stadt -->
    <label>Stadt:</label>
    <select name="Stadt" [(ngModel)]="wohnung.Stadt">
      <option value="" disabled >-- Bitte wählen --</option>
      <option *ngFor="let item of stadtList" [value]="item.id">
        {{ item.label }}
      </option>
    </select>

    <label>PLZ:</label>
    <input type="text" name="PLZ" [(ngModel)]="wohnung.PLZ" />

    <!-- Mietdetails -->
    <div class="section" *ngIf="wohnung.ZumMieten">
      <label *ngIf="wohnung.ZumMieten">Kaltmiete:</label>
      <input type="number" name="Kaltmiete" [(ngModel)]="wohnung.Kaltmiete" />

      <label *ngIf="wohnung.ZumMieten">Warmmiete:</label>
      <input type="number" name="Warmmiete" [(ngModel)]="wohnung.Warmmiete" />

      <label *ngIf="wohnung.ZumMieten">Nebenkosten:</label>
      <input type="number" name="Nebenkosten" [(ngModel)]="wohnung.Nebenkosten" />

      <label *ngIf="wohnung.ZumMieten">Kaution:</label>
      <input type="number" name="Kaution" [(ngModel)]="wohnung.Kaution" />
    </div>

    <!-- Kaufdetails -->
     <div class="section" *ngIf="wohnung.ZumKaufen">
      <label *ngIf="wohnung.ZumKaufen">Kaufpreis:</label>
      <input type="number" name="Kaufpreis" [(ngModel)]="wohnung.Kaufpreis" />
    </div>


    <label>Zimmer:</label>
    <input type="number" name="Zimmer" [(ngModel)]="wohnung.Zimmer" />

    <label>Fläche (m²):</label>
    <input type="number" name="Flaeche" [(ngModel)]="wohnung.Flaeche" />

    <label>Geschoss:</label>
    <input type="number" name="Geschoss" [(ngModel)]="wohnung.Geschoss" />

    <label>Frei ab:</label>
    <input type="date" name="FreiAb" [(ngModel)]="wohnung.FreiAb" />

    <!-- Checkboxes -->
    <div class="row">
      <label><input type="checkbox" [(ngModel)]="wohnung.Balkon" name="Balkon" /> Balkon</label>
      <label><input type="checkbox" [(ngModel)]="wohnung.Aufzug" name="Aufzug" /> Aufzug</label>
      <label><input type="checkbox" [(ngModel)]="wohnung.Stellplatz" name="Stellplatz" /> Stellplatz</label>
    </div>

    <!-- Heizung -->
    <label>Heizung:</label>
    <input type="text" name="Heizung" [(ngModel)]="wohnung.Heizung" />

    <!-- ENUM: Zustand -->
    <label>Zustand:</label>
    <select name="Zustand" [(ngModel)]="wohnung.Zustand">
      <option value="" disabled >-- Bitte wählen --</option>
      <option *ngFor="let item of zustandList" [value]="item.id">
        {{ item.label }}
      </option>
    </select>

    <!-- ENUM: Status -->
    <label>Status:</label>
    <select name="Status" [(ngModel)]="wohnung.Status">
      <option value="" disabled>-- Bitte wählen --</option>
      <option *ngFor="let item of statusList" [value]="item.id">
        {{ item.label }}
      </option>
    </select>

    <!-- ENUM: Energieausweis -->
    <label>Energieausweis:</label>
    <select name="Energieausweis" [(ngModel)]="wohnung.Energieausweis">
      <option value="" disabled>-- Bitte wählen --</option>
      <option *ngFor="let item of EnergieausweisTypList" [value]="item.id">
        {{ item.label }}
      </option>
    </select>

   <label>Bild hochladen:</label>
   <input type="file" multiple (change)="onFileSelected($event)" /><br /><br />

    <!-- عرض أسماء الملفات -->
    <div *ngIf="selectedFiles.length > 0">
     <p>Ausgewählte Dateien:</p>
     <ul>
       <li *ngFor="let file of selectedFiles">{{ file.name }}</li>
     </ul>
   </div>
   <!-- معاينات الصور -->
    <div class="preview-container" *ngIf="previews.length > 0">
      <div *ngFor="let img of previews" class="preview-box">
        <img [src]="img" width="100" height="100" />
      </div>
    </div>

  <button type="submit" [disabled]="!form.valid">Speichern</button>
</form>
