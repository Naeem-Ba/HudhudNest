<div class="wohnungen-list">
  <h2>Verfügbare Wohnungen</h2>

  <div *ngFor="let w of wohnungen" class="wohnung-card">
    <h3>{{ w.titel }}</h3>

    <p *ngIf="w.ownerId"><strong>Owner ID:</strong> {{ w.ownerId }}</p>

    <p><strong>Ort:</strong>
      {{ w.stadt || '—' }} {{ w.plz || '—' }}
    </p>

    <p><strong>Größe:</strong>
      {{ w.flaeche ? (w.flaeche + ' m²') : '—' }}
    </p>

    <p><strong>Preis:</strong>
      <span class="preis">
        {{ w.kaufpreis || w.warmmiete || w.kaltmiete | currency:'EUR':'symbol' }}
      </span>
    </p>

    <div *ngIf="w.bilder?.length">
      <strong>Bilder:</strong>
      <div *ngFor="let b of w.bilder" class="wohnung-bild">
        <img [src]="b.url" [alt]="b.altText || 'Bild'" [class.main]="b.isMain">
      </div>
    </div>

    <div *ngIf="w.amenities?.length">
      <strong>Amenities:</strong>
      <span *ngFor="let a of w.amenities">{{ a.name }} </span>
    </div>
    <button class="details-btn"
            (click)="gotoDetails(w.id)">
      Details ansehen
    </button>
  </div>
</div>
