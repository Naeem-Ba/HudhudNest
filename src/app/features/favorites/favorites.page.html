<!-- ================================================================
     favorites.page.html — Saved Favorites
     ================================================================ -->
<div class="page-root">

  <!-- Header -->
  <div class="page-header">
    <div>
      <h1>{{ 'FAVORITES.TITLE' | translate }}</h1>
      <p>{{ 'FAVORITES.SUBTITLE' | translate }}</p>
    </div>
  </div>

  <!-- Loading -->
  <app-loading-spinner *ngIf="loading()" [label]="'COMMON.LOADING' | translate" />

  <!-- Error -->
  <div class="state-card error-state" *ngIf="!loading() && error()" role="alert">
    <span aria-hidden="true">⚠️</span>
    <p>{{ error() }}</p>
    <button type="button" class="btn btn--outline btn--sm" (click)="load()">
      {{ 'COMMON.RETRY' | translate }}
    </button>
  </div>

  <!-- Empty -->
  <app-empty-state
    *ngIf="!loading() && favorites().length === 0 && !error()"
    icon="♡"
    [title]="'FAVORITES.EMPTY_TITLE' | translate"
    [message]="'FAVORITES.EMPTY_MESSAGE' | translate"
  />

  <!-- Favorites Grid -->
  <div class="fav-grid" *ngIf="!loading() && favorites().length > 0 && !error()">
    <article
      class="fav-card"
      *ngFor="let fav of favorites(); trackBy: trackById"
      [routerLink]="['/properties', getPropertyId(fav)]"
      tabindex="0"
      role="button"
      [attr.aria-label]="getTitle(fav)"
    >
      <!-- Image -->
      <div class="fav-card__image">
        <img
          [src]="getImage(fav)"
          [alt]="getTitle(fav)"
          loading="lazy"
          appImageFallback="/images/no-image.svg"
        />
      </div>

      <!-- Body -->
      <div class="fav-card__body">
        <h2 class="fav-card__title line-clamp-2">{{ getTitle(fav) }}</h2>
        <p class="fav-card__location line-clamp-1">📍 {{ getSubtitle(fav) }}</p>
        <div class="fav-card__footer">
          <strong class="fav-card__price">{{ getPrice(fav) }}</strong>
          <button type="button" class="fav-remove-btn"
            (click)="removeFavorite(fav); $event.stopPropagation(); $event.preventDefault()"
            [attr.aria-label]="'FAVORITES.REMOVE' | translate">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M8 13.5S1 9 1 5.5a4 4 0 018-1.36A4 4 0 0115 5.5c0 3.5-7 8-7 8z" fill="var(--danger)" opacity=".8"/>
            </svg>
          </button>
        </div>
      </div>
    </article>
  </div>

</div>
