 <header class="navbar">
      <div class="navbar-left">
    <a routerLink="/Home" class="logo-container">
      <img src="images/horizontal-logo.png" alt="Logo" />
    </a>
  </div>

      <nav class="nav-links">
        <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
        <a routerLink="/wohnungen" routerLinkActive="active">Wohnungen</a>
        
        <a *ngIf="isLoggedIn$ | async" 
        routerLink="/wohnung-add" 
        routerLinkActive="active">➕ Hinzufügen</a>

        <a routerLink="/kontakt" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">kontakt</a>
      </nav>

      <!-- ACCOUNT DROPDOWN -->
      <div class="account" *ngIf="isLoggedIn$ | async; else loginBtn">
          <!-- صورة الحساب -->
  <!-- إذا كان لديه صورة شخصية -->
<img *ngIf="profileImageUrl && hasCustomImage"
     class="avatar-img"
     [src]="profileImageUrl"
     (error)="useFallbackImage()"
     (click)="toggleDropdown()"
/>

<!-- إذا لم يكن لديه صورة شخصية -->
<div *ngIf="!hasCustomImage"
     class="avatar"
     (click)="toggleDropdown()">
  {{ avatarLetter }}
</div>

        <div class="dropdown" [class.open]="dropdownOpen">
          <p class="user-email">{{ userEmail }}</p>
          <a (click)="logout()">Abmelden</a>
        </div>
      </div>

      <ng-template #loginBtn>
        <button class="login-btn" routerLink="/login">Login</button>
      </ng-template>
    </header>
