<header class="navbar">
  <div class="navbar-left">
    <a routerLink="/home" class="logo-container">
      <img src="images/horizontal-logo.png" alt="Logo" />
    </a>
  </div>

  <nav class="nav-links">
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      {{ 'NAVBAR.HOME' | translate }}
    </a>
    <a routerLink="/wohnungen" routerLinkActive="active">
      {{ 'NAVBAR.WOHNUNGEN' | translate }}
    </a>
    
    <a *ngIf="isLoggedIn$ | async" 
       routerLink="/wohnung-add" 
       routerLinkActive="active">
       ➕ {{ 'NAVBAR.ADD' | translate }}
    </a>

    <a *ngIf="!(isAdmin$ | async)" 
       routerLink="/kontakt" 
       routerLinkActive="active" 
       [routerLinkActiveOptions]="{ exact: true }">
       {{ 'NAVBAR.CONTACT' | translate }}
    </a>

    <a *ngIf="(isLoggedIn$ | async) && (isAdmin$ | async)" 
       routerLink="/admin/messages" 
       routerLinkActive="active">
       📨 {{ 'NAVBAR.MESSAGES' | translate }}
    </a>
  </nav>

  <div class="navbar-right">
    
    <div class="lang-dropdown">
      <button class="lang-btn" (click)="toggleLangMenu(); $event.stopPropagation()">
        {{ currentLang.toUpperCase() }} ▼
      </button>
      <ul class="lang-menu" [class.open]="langMenuOpen">
        <li (click)="changeLang('ar')">العربية</li>
        <li (click)="changeLang('en')">English</li>
        <li (click)="changeLang('de')">Deutsch</li>
      </ul>
    </div>

    <div class="account" *ngIf="isLoggedIn$ | async; else loginBtn">
      <div class="avatar-wrapper" (click)="toggleDropdown(); $event.stopPropagation()">
        <img *ngIf="hasCustomImage"
             class="avatar-img"
             [src]="profileImageUrl"
             (error)="useFallbackImage()" />

        <div *ngIf="!hasCustomImage" class="avatar">
          {{ avatarLetter }}
        </div>
      </div>

      <div class="dropdown" [class.open]="dropdownOpen">
        <div class="dropdown-header">
          <p class="user-email">{{ userEmail }}</p>
        </div>
        <hr />
        <a (click)="logout()" class="logout-link">
          {{ 'NAVBAR.LOGOUT' | translate }}
        </a>
      </div>
    </div>

    <ng-template #loginBtn>
      <button class="login-btn" routerLink="/login">
        {{ 'NAVBAR.LOGIN' | translate }}
      </button>
    </ng-template>

  </div>
</header>
