<div class="profile-wrapper">
  
  <div *ngIf="isLoading()" class="state-info">{{ 'PROFILE.SYNC_DATA' | translate }}</div>

  <div *ngIf="errorMsg()" class="state-info error">{{ errorMsg() }}</div>

  <div class="profile-card" *ngIf="user() && !isLoading()">
    
    <div class="header-section">
      <h2>{{ 'PROFILE.TITLE' | translate }}</h2>
      <p>{{ 'PROFILE.SUBTITLE' | translate }}</p>
    </div>

    <div class="avatar-container">
      <div class="img-wrapper">
        <img [src]="avatarPreview() || 'assets/default-avatar.png'" alt="User Avatar">
      </div>
      <label class="upload-badge">
        <input type="file" (change)="onFileSelected($event)" hidden accept="image/*">
        <span>📷</span>
      </label>
    </div>

    <form class="custom-form">
      <div class="field">
        <label>{{ 'PROFILE.FIRST_NAME' | translate }}</label>
        <input type="text" [(ngModel)]="user()!.Vorname" name="fn">
      </div>

      <div class="field">
        <label>{{ 'PROFILE.LAST_NAME' | translate }}</label>
        <input type="text" [(ngModel)]="user()!.Name" name="ln">
      </div>

      <div class="field">
        <label>{{ 'PROFILE.DISPLAY_NAME' | translate }}</label>
        <input type="text" [(ngModel)]="user()!.DisplayName" name="dn">
      </div>

      <div class="field">
        <label>{{ 'PROFILE.EMAIL_LOCKED' | translate }}</label>
        <input type="email" [value]="user()!.Email" disabled>
      </div>

      <div class="field">
      <label>
       {{ 'PROFILE.PHONE' | translate }}
        <span *ngIf="user()?.IsAgent" style="color: red;">{{ 'PROFILE.PHONE_REQUIRED_AGENT' | translate }}</span>
      </label>
      <input type="tel" [(ngModel)]="user()!.Phone" name="ph" [placeholder]="user()?.IsAgent ? ('PROFILE.PHONE_PLACEHOLDER' | translate) : ''">
    </div>

    <div class="agent-section">
  <div class="verified-agent-badge" *ngIf="user()?.IsAgent && user()?.TaxNumber && user()?.Phone">
    <div class="success-icon">✅</div>
    <p class="success-text">{{ 'PROFILE.AGENT_VERIFIED_MSG' | translate }}</p>
    </div>

  <div class="agent-setup" *ngIf="!(user()?.IsAgent && user()?.TaxNumber && user()?.Phone)">
    <label class="checkbox-field">
      <input type="checkbox" [(ngModel)]="user()!.IsAgent" name="ag">
      <span>{{ 'PROFILE.AGENT_CHECKBOX' | translate }}</span>
    </label>

    <div class="tax-field" *ngIf="user()?.IsAgent" >
      <div class="field">
        <label>{{ 'PROFILE.TAX_NUMBER' | translate }}
          <span *ngIf="user()?.IsAgent" style="color: red;">{{ 'PROFILE.PHONE_REQUIRED_AGENT' | translate }}</span>
        </label>
        <input type="text" 
               [(ngModel)]="user()!.TaxNumber" 
               name="tn" 
               [placeholder]="'PROFILE.TAX_PLACEHOLDER' | translate">
      </div>
    </div>
  </div>
</div>

              <div class="password-section">
    <button type="button" class="btn-toggle-pass" (click)="showPasswordForm.set(!showPasswordForm())">
      {{ showPasswordForm() ? ('PROFILE.CANCEL_PASS_BTN' | translate) : ('PROFILE.CHANGE_PASS_BTN' | translate)}}
    </button>

    <div class="password-fields" *ngIf="showPasswordForm()" [@expandAnimation]>
      <div class="field">
        <label>{{ 'PROFILE.CURRENT_PASS' | translate }}</label>
        <input type="password" [(ngModel)]="passwordData.currentPassword" name="currentPassword" placeholder="••••••••">
      </div>

      <div class="field">
        <label>{{ 'PROFILE.NEW_PASS' | translate }}</label>
        <input type="password" [(ngModel)]="passwordData.newPassword" name="newPassword" placeholder="••••••••">
      </div>

      <div class="field">
        <label>{{ 'PROFILE.CONFIRM_PASS' | translate }}</label>
        <input type="password" [(ngModel)]="passwordData.confirmPassword" name="confirmPassword" placeholder="••••••••">
      </div>

      <button class="btn-save-pass" (click)="onChangePassword()">{{ 'PROFILE.SAVE_PASS' | translate }}</button>
    </div>
  </div>

    </form>

    <div class="actions">
      <button class="btn-save" (click)="onSaveProfile()">{{ 'PROFILE.SAVE_CHANGES' | translate }}</button>
      <button class="btn-delete" (click)="onDeleteAccount()">{{ 'PROFILE.DELETE_ACCOUNT' | translate }}</button>
    </div>

  </div>
</div>
