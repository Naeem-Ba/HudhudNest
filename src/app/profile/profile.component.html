<div class="profile-wrapper" *ngIf="user">

  <div class="profile-card">

    <h2 class="title">الملف الشخصي</h2>

    <!-- ===== Avatar ===== -->
    <div class="avatar-section">
      <div class="avatar-preview">
        <img [src]="user.ImageUrl || 'default-avatar.png'" />
      </div>

      <label class="upload-btn">
        📷 تغيير الصورة
        <input
          type="file"
          accept="image/*"
          hidden
          (change)="onFileChange($event)"
        />
      </label>
    </div>

    <!-- ===== Form ===== -->
    <form class="form-grid" novalidate>

      <div class="form-group">
        <label for="vorname">الاسم الأول</label>
        <input
          id="vorname"
          name="vorname"
          type="text"
          [(ngModel)]="user.Vorname"
        />
      </div>

      <div class="form-group">
        <label for="name">اسم العائلة</label>
        <input
          id="name"
          name="name"
          type="text"
          [(ngModel)]="user.Name"
        />
      </div>

      <div class="form-group">
        <label for="displayName">اسم العرض</label>
        <input
          id="displayName"
          name="displayName"
          type="text"
          [(ngModel)]="user.DisplayName"
        />
      </div>

      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input
          id="email"
          name="email"
          type="email"
          [value]="user.Email"
          disabled
        />
      </div>

      <div class="form-group">
        <label for="phone">رقم الهاتف</label>
        <input
          id="phone"
          name="phone"
          type="tel"
          [(ngModel)]="user.Phone"
        />
      </div>

      <div class="form-group checkbox">
        <label>
          <input
            type="checkbox"
            name="isAgent"
            [(ngModel)]="user.IsAgent"
          />
          وكيل عقاري
        </label>
      </div>

    </form>

    <button class="save-btn" (click)="save()">
      💾 حفظ التغييرات
    </button>

  </div>
</div>
