<div class="profile-wrapper">
  
  <div *ngIf="isLoading()" class="state-info">جاري مزامنة بياناتك...</div>

  <div *ngIf="errorMsg()" class="state-info error">{{ errorMsg() }}</div>

  <div class="profile-card" *ngIf="user() && !isLoading()">
    
    <div class="header-section">
      <h2>إعدادات الحساب</h2>
      <p>قم بتحديث معلوماتك الشخصية وصورة البروفايل</p>
    </div>

    <div class="avatar-container">
      <div class="img-wrapper">
        <img [src]="avatarPreview() || 'assets/default-avatar.png'" alt="User Avatar">
      </div>
      <label class="upload-badge">
        <input type="file" (change)="onFileSelected($event)" hidden accept="image/*">
        <span>📷</span>
      </label>
    </div>

    <form class="custom-form">
      <div class="field">
        <label>الاسم الأول</label>
        <input type="text" [(ngModel)]="user()!.Vorname" name="fn">
      </div>

      <div class="field">
        <label>اسم العائلة</label>
        <input type="text" [(ngModel)]="user()!.Name" name="ln">
      </div>

      <div class="field">
        <label>اسم العرض (الاسم المستعار)</label>
        <input type="text" [(ngModel)]="user()!.DisplayName" name="dn">
      </div>

      <div class="field">
        <label>البريد الإلكتروني (لا يمكن تعديله)</label>
        <input type="email" [value]="user()!.Email" disabled>
      </div>

      <div class="field">
      <label>
        رقم الهاتف 
        <span *ngIf="user()?.IsAgent" style="color: red;">* (إلزامي للوكلاء)</span>
      </label>
      <input type="tel" [(ngModel)]="user()!.Phone" name="ph" [placeholder]="user()?.IsAgent ? 'يجب إدخال الرقم هنا' : ''">
    </div>

    <div class="agent-section">
      <label class="checkbox-field">
        <input type="checkbox" [(ngModel)]="user()!.IsAgent" name="ag">
        <span>تفعيل حسابي كوكيل عقاري موثق</span>
      </label>

      <div class="tax-field" *ngIf="user()?.IsAgent" [@expandAnimation]>
        <div class="field">
          <label>الرقم الضريبي (Steuernummer)</label>
          <!--<input type="text" [(ngModel)]="user()!.TaxNumber" name="tn" placeholder="مثال: 12/345/67890">-->
        </div>
      </div>
    </div>

              <div class="password-section">
    <button type="button" class="btn-toggle-pass" (click)="showPasswordForm.set(!showPasswordForm())">
      {{ showPasswordForm() ? 'إلغاء تغيير كلمة المرور' : '🔐 تغيير كلمة المرور' }}
    </button>

    <div class="password-fields" *ngIf="showPasswordForm()" [@expandAnimation]>
      <div class="field">
        <label>كلمة المرور الحالية</label>
        <input type="password" [(ngModel)]="passwordData.currentPassword" placeholder="••••••••">
      </div>

      <div class="field">
        <label>كلمة المرور الجديدة</label>
        <input type="password" [(ngModel)]="passwordData.newPassword" placeholder="••••••••">
      </div>

      <div class="field">
        <label>تأكيد كلمة المرور الجديدة</label>
        <input type="password" [(ngModel)]="passwordData.confirmPassword" placeholder="••••••••">
      </div>

      <!--<button class="btn-save-pass" (click) Arab="onChangePassword()">تحديث كلمة المرور</button>-->
    </div>
  </div>

    </form>

    <div class="actions">
      <button class="btn-save" (click)="onSaveProfile()">حفظ التغييرات</button>
      <button class="btn-delete" (click)="onDeleteAccount()">حذف الحساب نهائياً</button>
    </div>

  </div>
</div>
