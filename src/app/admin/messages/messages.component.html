<div class="admin-container">

  <h2>📩 رسائل التواصل</h2>

  <div *ngIf="loading" class="loading">جارٍ التحميل...</div>

  <div *ngIf="!loading && messages.length === 0" class="empty">
    لا توجد رسائل حتى الآن.
  </div>

  <table *ngIf="messages.length > 0" class="messages-table">
    <thead>
      <tr>
        <th>الاسم</th>
        <th>البريد</th>
        <th>الرسالة</th>
        <th>التاريخ</th>
        <th>الحالة</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let msg of messages" [routerLink]="['/admin/messages', msg.Id]" class="clickable-row" role="link">
        <td>{{ msg.Name }}</td>
        <td>{{ msg.Email }}</td>
        <td>{{ msg.Message }}</td>
        <td>{{ msg.SentAt | date:'medium' }}</td>
        <td>{{ msg.IsRead ? 'مقروءة' : 'غير مقروءة' }}</td>
      </tr>
    </tbody>
  </table>
    <div class="actions">
    <button class="back-btn" (click)="goBack()">⬅ رجوع</button>
  </div>


</div>
