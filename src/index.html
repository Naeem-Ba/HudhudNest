<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>HudhudNest</title>
  <base href="/">
  <script>
    // Shared property links are canonical path URLs (/properties/:id — PropertyShareUrlService),
    // but the app routes with Angular's hash location (/#/properties/:id), so a visitor landing
    // on the path form would fall through to the '' -> home redirect. Bridge it to the hash
    // route before Angular boots. The real query string (utm_* attribution) stays where
    // AttributionContextService reads it: ahead of the '#'.
    (function () {
      var m = /^\/(properties|wohnungen)\/([^\/]+)\/?$/.exec(location.pathname);
      if (m && !location.hash) {
        location.replace('/' + location.search + '#/properties/' + m[2]);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F2742">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
