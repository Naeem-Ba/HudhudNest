<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>HudhudNest | منصة عقارية رقمية في سوريا</title>
  <!--
    Static fallback description / Open Graph card (QA Phase 20, P20-D01). This shell is what every route that has no
    edge-function preview is served with (the home page, /properties, short stays, investments, offices, pricing, ...),
    and WhatsApp / Telegram / Facebook read it without running any JavaScript. Angular's MetaService overwrites these
    tags per page once it boots, so a browser user sees the page-specific values. Arabic is the default language.
    Absolute https URLs on purpose: crawlers do not resolve relative image paths. No og:url on purpose: Facebook treats it as the page's canonical, and one fixed value here would merge every shared link into the home
    page. Always the production origin, like the
    JSON-LD below (Staging/local are protected by noindex + a block-all robots.txt).
  -->
  <meta name="description" content="ابحث عن شقق وعقارات للبيع والإيجار في سوريا بسهولة. صور واضحة، معلومات منظمة، وتواصل مباشر مع المالك أو المكتب العقاري.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="هدهد نيست">
  <meta property="og:title" content="HudhudNest | منصة عقارية رقمية في سوريا">
  <meta property="og:description" content="ابحث عن شقق وعقارات للبيع والإيجار في سوريا بسهولة. صور واضحة، معلومات منظمة، وتواصل مباشر مع المالك أو المكتب العقاري.">
  <meta property="og:image" content="https://hudhudnest.com/images/og-default.png">
  <meta name="twitter:card" content="summary_large_image">
  <base href="/">
  <script>
    // The app used to route with Angular's hash location (/#/properties/:id) -- switched to
    // real paths (/properties/:id) because hash fragments are effectively invisible to search
    // engines (see ARD-Wohnungsmieten.md ADR-001). Canonical/shared/og:url links never carried
    // a hash even back then (PropertyShareUrlService always built the plain path form), so this
    // is purely a backward-compatibility bridge for links already distributed before the switch
    // -- old #/properties/:id or #/auth/verify-email?... URLs (emails, bookmarks, old shares)
    // still need to land on real content instead of silently falling through the '**' -> home
    // route once hash fragments stop meaning anything to the router.
    (function () {
      var hash = location.hash;
      if (hash.length > 1 && hash.charAt(1) === '/') {
        var hashPath = hash.slice(1);
        var queryIndex = hashPath.indexOf('?');
        var path = queryIndex === -1 ? hashPath : hashPath.slice(0, queryIndex);
        var hashQuery = queryIndex === -1 ? '' : hashPath.slice(queryIndex);
        location.replace(path + (hashQuery || location.search));
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F2742">
  <script>
    // Theme before first paint (no flash). Same rule as ThemeService: an explicit choice stored under
    // hudhudnest-theme wins ('system' = follow the OS); otherwise light, the default.
    // ThemeService takes over once Angular boots.
    (function () {
      var t = null;
      try { t = localStorage.getItem('hudhudnest-theme') || localStorage.getItem('aqar-tech-theme'); } catch (e) {}
      if (t === 'system') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } else if (t !== 'dark') {
        t = 'light';
      }
      var root = document.documentElement;
      root.setAttribute('data-theme', t);
      root.style.colorScheme = t;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) { meta.setAttribute('content', t === 'dark' ? '#0a0a0c' : '#0F2742'); }
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Fonts are served from this origin (public/fonts), not from Google: no visitor IP address goes to a third party. -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <!--
    Organization/WebSite JSON-LD (schema.org) -- static, not injected by StructuredDataService
    (src/app/core/services/structured-data.service.ts), on purpose: this never changes per
    route or per data, so it belongs in the raw HTML shell, present even before Angular boots
    (unlike anything StructuredDataService sets, which only exists once a component has run).
    The URL is always the real production origin, even in a Staging/local build -- this
    describes which organization the site IS, not which environment is serving this particular
    response, and Staging/local already carry noindex + a disallow-everything robots.txt
    (tools/generate-robots.mjs) regardless.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "HudhudNest",
    "alternateName": "هدهد نيست",
    "url": "https://hudhudnest.com",
    "logo": "https://hudhudnest.com/images/horizontal-logo.png"
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "HudhudNest",
    "alternateName": "هدهد نيست",
    "url": "https://hudhudnest.com",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://hudhudnest.com/properties?search={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
